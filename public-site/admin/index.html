<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proud Pops Admin</title><link rel="icon" href="../favicon.png"><style>body{margin:0;background:#081523;color:#fff;font:16px system-ui}.wrap{width:min(900px,calc(100% - 30px));margin:40px auto}.card{background:#10243c;padding:25px;border-radius:18px;margin:18px 0}input,textarea,select,button{width:100%;padding:12px;margin:7px 0;border-radius:8px;border:1px solid #ffffff33;box-sizing:border-box}button{background:#c77c45;font-weight:800;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border-top:1px solid #ffffff22;padding:14px 0}.muted{color:#b7c2ce}.hidden{display:none}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Proud Pops Admin</h1><div id="login" class="card"><h2>Sign in</h2><input id="user" placeholder="Username" autocomplete="username"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Sign in</button><p id="loginMsg" class="muted"></p></div><div id="app" class="hidden"><div class="card"><h2>Publish announcement</h2><input id="title" placeholder="Title, e.g. Labor Day Closure"><textarea id="message" rows="4" placeholder="Announcement message"></textarea><div class="row"><select id="type"><option>CLOSURE</option><option>IMPORTANT</option><option>INFO</option><option>PROMOTION</option></select><select id="status"><option>PUBLISHED</option><option>DRAFT</option></select></div><div class="row"><label>Starts<input id="start" type="datetime-local"></label><label>Expires<input id="end" type="datetime-local"></label></div><button onclick="save()">Save announcement</button></div><div class="card"><h2>Announcements</h2><div id="items"></div></div></div></div><script src="config.js"></script><script>let token='';const api=window.PROUD_POPS_API;async function login(){let r=await fetch(api+'/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})});let j=await r.json();if(!r.ok){document.getElementById('loginMsg').textContent=j.message;return}token=j.idToken;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');load()}async function req(path,opt={}){opt.headers={...(opt.headers||{}),authorization:'Bearer '+token,'content-type':'application/json'};return fetch(api+path,opt)}async function save(){let b={title:document.getElementById('title').value,message:document.getElementById('message').value,type:document.getElementById('type').value,status:document.getElementById('status').value,startEpoch:document.getElementById('start').value?Date.parse(document.getElementById('start').value)/1000:Math.floor(Date.now()/1000),endEpoch:document.getElementById('end').value?Date.parse(document.getElementById('end').value)/1000:4102444800};await req('/admin/announcements',{method:'POST',body:JSON.stringify(b)});document.getElementById('title').value='';document.getElementById('message').value='';load()}async function load(){let r=await req('/admin/announcements');if(r.status==401){location.reload();return}let a=await r.json();document.getElementById('items').innerHTML=a.sort((x,y)=>y.updatedEpoch-x.updatedEpoch).map(x=>`<div class="item"><b>${esc(x.title)}</b> <span class="muted">${x.type} • ${x.status}</span><p>${esc(x.message)}</p><button onclick="del('${x.id}')">Delete</button></div>`).join('')||'<p class="muted">No announcements yet.</p>'}async function del(id){if(confirm('Delete this announcement?')){await req('/admin/announcements/'+id,{method:'DELETE'});load()}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
